<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#f7f4ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1613" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
    />

    <script>
      // Apply the stored theme before first paint, otherwise a visitor who
      // chose dark sees a white flash on every load.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {
          /* private mode or blocked storage: fall back to the system setting */
        }
      })();
    </script>

    <!--
      Title, description, canonical and social tags come from the SEO component
      and are hoisted into <head> by React. Copies here would duplicate every
      tag, because hoisting appends rather than replaces. Crawlers that do not
      run JS see none of them until build-time pre-rendering lands.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
