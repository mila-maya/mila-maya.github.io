<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f6bb3" />
    <!--
      Title, description, canonical and social tags come from the SEO component
      and are hoisted into <head> by React. Copies here would duplicate every
      tag, because hoisting appends rather than replaces. Crawlers that do not
      run JS see none of them until build-time pre-rendering lands.
    -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
